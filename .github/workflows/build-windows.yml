name: Build Windows app

on:
  push:
    branches: [main]
    # Android-only changes don't need a new Windows build or website deploy
    paths-ignore: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync tests
        run: npm test

      - name: Bundle app code
        run: npm run bundle

      - name: Set version (1.0.<build number>)
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build installer + portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SalesCashTracker-windows
          path: |
            dist/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sales Cash Tracker v1.0.${{ github.run_number }}
          body: |
            **Download `SalesCashTracker-Setup-1.0.${{ github.run_number }}.exe`** and run it to install (or update) the app.

            Your records are kept on your PC and stay safe when you install a newer version.
            `SalesCashTracker-Portable-…exe` runs without installing.
          files: dist/*.exe
          make_latest: true
