name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Report compile errors
        if: failure()
        run: |
          # Turn Kotlin / Gradle errors into annotations so they show on the run page
          grep -E '^e: |error:|What went wrong|Could not resolve|> ' build.log | grep -v '^> Task' | head -40 > errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n+1)); [ $n -gt 10 ] && break
            echo "::error::${line//$'\n'/ }"
          done < errors.txt
          echo "::error title=All errors::$(sed ':a;N;$!ba;s/\n/%0A/g' errors.txt)"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/SalesCashTracker-1.0.${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SalesCashTracker-android
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Android app v1.0.${{ github.run_number }}
          body: |
            **Download `SalesCashTracker-1.0.${{ github.run_number }}.apk`** on your phone and open it to install (or update).

            First time: Android will ask to allow installing apps from your browser / Files app — allow it once.
            Sign in with the same email and password as the website and Windows app; all records sync.
          files: out/*.apk
          make_latest: false
