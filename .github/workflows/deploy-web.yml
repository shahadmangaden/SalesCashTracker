name: Deploy web app

on:
  push:
    branches: [main]
    # Android-only changes don't need a new Windows build or website deploy
    paths-ignore: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync tests
        run: npm test
      - name: Build web app
        run: npm run build:web
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
      - name: Zip web app (for self-hosting)
        run: cd web-dist && zip -qr ../SalesCashTracker-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: SalesCashTracker-web
          path: SalesCashTracker-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
