<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com">
  <title>Sales &amp; Cash Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar" id="titlebar"><span class="tb-logo">S</span><span class="tb-title">Sales &amp; Cash Tracker</span></div>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <div class="brand-name" id="brandCompany">BAKHTAR TRAVELS</div>
        <div class="brand-sub" id="brandUser">Sales &amp; Cash Tracker</div>
      </div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active"><span class="ic">▦</span>Dashboard</button>
      <button data-view="bookings"><span class="ic">✈</span>Sales / Bookings</button>
      <button data-view="cash"><span class="ic">◈</span>Cash Paid Log</button>
      <button data-view="ledger"><span class="ic">☰</span>Agent Ledger</button>
      <button data-view="expiry"><span class="ic">⏱</span>Visa Expiry <span class="badge" id="expiryBadge" hidden></span></button>
      <button data-view="settings"><span class="ic">⚙</span>Settings</button>
    </nav>
    <div class="side-actions">
      <button class="btn primary block" id="sideAddBooking">+ New Sale</button>
      <button class="btn block ghost-light" id="sideAddCash">+ Cash Paid</button>
    </div>
    <div class="account-box" id="accountBox" hidden></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="viewTitle">Dashboard</h1>
      <div class="top-controls">
        <span class="sync-state" id="syncState" hidden></span>
        <label class="month-pick" id="monthPick">Period
          <select id="monthFilter"></select>
        </label>
        <input type="search" id="search" placeholder="Search customer, agent, PNR…" hidden>
        <button class="icon-btn" id="topSettings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </header>
    <section id="view"></section>
  </main>

  <div class="modal-back" id="modalBack" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div class="auth-screen" id="authScreen" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <button class="fab" id="fab" title="New sale" aria-label="New sale">+</button>

  <script src="../app-dist/desktop-sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
